<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Just Landed · Airport to city</title>
<meta name="description" content="Just landed in Greece? Find the best ways to get to or from the airport — live departures, fares, journey times and walking directions.">
<link rel="icon" type="image/svg+xml" href="favicon-v16.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=Chakra+Petch:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#111111;--ink:#fafaf8;--muted:#8f8f86;--amber:#ffc107;
  --card:#1a1a1d;--tile:#242428;--line:#2c2c31;--tb:#33333a;
  --green:#72e06a;--violet:#c77dff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Chakra Petch",system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
 .wrap{max-width:1180px;margin:0 auto;padding:24px 28px 44px}
header{height:62px;display:flex;align-items:center;justify-content:space-between;margin-bottom:54px;border-bottom:1px solid var(--line);padding-bottom:18px}
.header-logo{display:block;width:290px;height:auto;max-height:58px;object-fit:contain}
.header-tools{display:flex;align-items:center;gap:18px}
.lang-switch{display:flex;align-items:center;gap:6px;font:700 10px/1 "JetBrains Mono",monospace;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.lang-switch button{appearance:none;border:0;background:transparent;color:var(--muted);font:700 10px/1 "JetBrains Mono",monospace;padding:4px 2px;cursor:pointer}.lang-switch button.active{color:var(--amber)}
.clock{font:700 11px/1 "JetBrains Mono",monospace;letter-spacing:.05em;border:1px solid var(--line);border-radius:22px;padding:10px 14px}
.menu{display:none}
.hero{text-align:left;margin-bottom:34px}.eyebrow{font:700 12px/1 "JetBrains Mono",monospace;letter-spacing:.07em;color:var(--amber);text-transform:uppercase;margin-bottom:17px}
.hero h1{font:900 clamp(54px,5.5vw,86px)/.92 "Inter",sans-serif;letter-spacing:-.06em;margin:0;max-width:720px;text-transform:uppercase}.hero p{margin:19px 0 0;color:var(--ink);font-size:17px;line-height:1.45;max-width:660px}
.airports{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:34px}.airport{position:relative;background:linear-gradient(180deg,#17191b,#111315);border:1px solid var(--line);border-radius:16px;padding:18px 14px 20px;min-height:365px;display:flex;flex-direction:column;align-items:center;text-align:center;transition:border-color .14s,transform .14s,background .14s}
.airport:hover,.airport:focus-visible{border-color:var(--amber);transform:translateY(-2px);background:#191b1d;outline:none}.airport.selected{border-color:var(--amber)}
.landmark{width:100%;height:190px;display:flex;align-items:center;justify-content:center;margin-bottom:16px}.landmark img{width:176px;height:176px;display:block;object-fit:contain}
.airport-name{font:800 23px/1 "Inter",sans-serif;text-transform:uppercase;letter-spacing:-.035em}.airport-route{font:600 17px/1 "Chakra Petch",sans-serif;margin-top:11px;color:#d8d8d5}.airport-next{display:none}.airport-arrow{font:700 31px/1 "JetBrains Mono",monospace;color:var(--amber);margin-top:auto;padding-top:20px}
.return-button{display:flex;align-items:center;justify-content:center;gap:22px;width:min(410px,100%);height:64px;margin:14px auto 0;background:linear-gradient(180deg,#191b1d,#141618);border:1px solid var(--line);border-radius:14px;font:700 18px/1 "Inter",sans-serif;letter-spacing:.01em}.return-button:hover,.return-button:focus-visible{border-color:var(--amber);outline:none}.return-icon{color:var(--amber);font:700 28px/1 "JetBrains Mono",monospace}.return-chevron{font-size:28px;color:#bdbdb8}
.value-strip,.how,.footer-row{display:none}
@media(max-width:900px){.wrap{padding:18px 18px 34px}header{margin-bottom:42px}.header-logo{width:220px}.hero h1{font-size:56px}.hero p{font-size:15px}.airports{grid-template-columns:repeat(3,1fr);gap:10px}.airport{min-height:320px}.landmark{height:165px}.landmark img{width:150px;height:150px}.airport-name{font-size:19px}.airport-route{font-size:15px}}
@media(max-width:620px){.wrap{padding:14px 13px 28px}header{height:50px;margin-bottom:38px;padding-bottom:12px}.header-logo{width:180px;max-height:42px}.clock{display:none}.menu{display:flex}.hero{margin-bottom:20px}.eyebrow{font-size:9px;margin-bottom:11px}.hero h1{font-size:42px}.hero p{font-size:12px;margin-top:12px}.airports{grid-template-columns:repeat(2,1fr);gap:8px;margin-top:22px}.airport{min-height:270px;padding:13px 9px 16px;border-radius:13px}.landmark{height:135px;margin-bottom:10px}.landmark img{width:122px;height:122px}.airport-name{font-size:15px}.airport-route{font-size:12px;margin-top:7px}.airport-arrow{font-size:24px;padding-top:14px}.airport:last-child{grid-column:1/-1}.return-button{height:56px;font-size:15px;margin-top:10px}.return-icon,.return-chevron{font-size:23px}}
/* Keep the approved raster lockup untouched. No SVG logo recreation. */
</style>
</head>
<body>
<div class="wrap">
<header>
  <a href="index.html" aria-label="Just Landed home">
    <img class="header-logo" src="just-landed-approved-logo.png" alt="JUST LANDED — Airport to City">
  </a>
  <div class="header-tools">
    <div class="lang-switch" id="lang-switch" aria-label="Language">
      <button type="button" data-lang="en" class="active">EN</button><span>·</span>
      <button type="button" data-lang="el">ΕΛ</button>
    </div>
    <div class="clock" id="clock">--:--</div>
    <div class="menu" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>
</header>

<section class="hero">
  <div class="eyebrow">GET TO OR FROM THE AIRPORT</div>
  <h1>Where did you land?</h1>
  <p>Choose your airport to see the best ways to get to or from the city.</p>
</section>

<section class="airports" id="airports" aria-label="Airports"></section>

<a class="return-button" href="#" onclick="return false" aria-label="Plan a return trip">
  <span class="return-icon">⇄</span><span>PLAN A RETURN TRIP</span><span class="return-chevron">›</span>
</a>

<script src="data.js"></script>
<script>
function renderClock(){
  document.getElementById("clock").textContent =
    new Intl.DateTimeFormat([], {hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(new Date());
}
function soonestAirport(code){
  const ap=AIRPORTS[code], now=new Date(); let best=null;
  for(const o of ap.options||[]){
    if(o.onDemand) continue;
    const r=nextTwo(o,now);
    if(r.closed&&!best) continue;
    if(!best||r.until<best.until) best={...r,o};
  }
  return best;
}
function airportCard(code){
  const ap=AIRPORTS[code], name=ap.name.split(" (")[0];
  return `<a class="airport" href="${ap.slug}.html" onclick="localStorage.setItem('jl-airport','${code}')">
    <div class="landmark"><img src="/${({ATH:"athens-landmark.png",SKG:"thessaloniki-landmark.png",HER:"heraklion-landmark.png",CHQ:"chania-landmark.png",JTR:"santorini-landmark.png"})[code]}" alt="${name} landmark" loading="eager"></div>
    <div class="airport-name">${name}</div>
    <div class="airport-route">${code} → City</div>
    <div class="airport-arrow">→</div>
  </a>`;
}
function render(){document.getElementById("airports").innerHTML=ORDER.map(airportCard).join("");}
async function boardLive(){
  try{
    const r=await fetch("/api/airport",{cache:"no-store"}); if(!r.ok)return;
    const j=await r.json(), d=new Date(), base=d.getHours()*60+d.getMinutes(), routes=j.routes||{};
    for(const rc of ["2051","3028","5373","5675"]){
      const mins=routes[rc];
      if(Array.isArray(mins)&&mins.length)LIVE[rc]={deps:mins.map(m=>base+m),ts:Date.now()};
      else delete LIVE[rc];
    }
    render();
  }catch(e){}
}
renderClock();render();
setInterval(()=>{renderClock();render()},15000);
boardLive();setInterval(boardLive,30000);
</script>
</body>
</html>
